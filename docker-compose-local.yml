# see the .env file to set the variables used here
version: "2"
services:
  erddap:
    # Mirrors docker-compose.yml so local testing exercises the same patched
    # image as production. Requires `docker compose up -d --build`.
    # Held at v2.30.0 -- see docker-compose.yml for why v2.31.x is unusable here.
    build:
      context: ./docker/erddap
      args:
        ERDDAP_IMAGE: "axiom/docker-erddap:v2.30.0"
    image: "hakai-erddap:v2.30.0-patched"
    restart: always
    container_name: ${CONTAINER_NAME:-erddap}
    platform: linux/x86_64
    env_file:
      - .env
    # Loopback-only; still reachable at http://localhost:${HOST_PORT}.
    ports:
      - "127.0.0.1:${HOST_PORT:-8090}:8080"
    security_opt:
      - no-new-privileges:true
    volumes:
      - "./erddap/conf/robots.txt:/usr/local/tomcat/webapps/ROOT/robots.txt"
      - "./erddap/content:/usr/local/tomcat/content/erddap"
      - "./erddap/data:/erddapData"
      - "${DATASETS_DIR:-./datasets}:/datasets"
      # Bind the single script rather than the whole directory, so the image's
      # 50-datasets.d.sh (datasets.d/ -> datasets.xml) is not shadowed out.
      # See docker-compose.yml for the full rationale.
      - "./init.d/05-fix-webapp-overlay-perms.sh:/init.d/05-fix-webapp-overlay-perms.sh:ro"
      - "./init.d/replace-datasets-secrets.sh:/init.d/replace-datasets-secrets.sh:ro"
      # - "/mnt/s3/algex:/algae_explorer"
      - "./datasets.d:/datasets.d"
      - "./erddap/server.xml:/usr/local/tomcat/conf/server.xml"      
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:${HOST_PORT}/erddap/index.html"
        ]
      interval: 10s

