# see the .env file to set the variables used here
version: "2"
services:
  erddap:
    # Builds a thin patch layer over axiom/docker-erddap to pick up Ubuntu
    # security updates missing from the upstream base. See
    # docker/erddap/Dockerfile. Requires `docker compose up -d --build`.
    #
    # Held at v2.30.0, NOT the latest v2.31.1. ERDDAP v2.31.0 added an
    # unconditional handleViaFixedOrSubsetVariables() call to the top of
    # EDDTableFromDatabase.getDataForDapQuery (upstream e71fbafa, PR #36).
    # EDDTable.subsetVariablesDataTable builds the subset table by calling
    # getDataForDapQuery with "<subsetVars>&distinct()" -- a query that is by
    # construction fully satisfiable from subsetVariables -- so the new call
    # returns true and recurses straight back in. The reentrance guard at
    # EDDTable.java:12208 then aborts TASK_CREATE_SUBSET_TABLE with
    #   Unable to create subsetVariablesDataTable. (in danger of stack overflow)
    # for every EDDTableFromDatabase dataset declaring subsetVariables, which is
    # 54 of 68 in datasets.d/ and 15 of 20 in datasets.d.development/.
    #
    # Still broken on v2.31.1 and upstream main as of 2026-10-30, and still
    # >=v2.27.0, so this remains the official non-root base that
    # init.d/05-fix-webapp-overlay-perms.sh exists for.
    #
    # Unpin once upstream guards that call (e.g. with isProcessingSubset()).
    # The alternative -- hand-maintained content/erddap/subset/<id>.json files,
    # which short-circuit before the recursion -- was rejected: they are read
    # verbatim forever, so new stations would not appear until regenerated.
    build:
      context: ./docker/erddap
      args:
        ERDDAP_IMAGE: "axiom/docker-erddap:v2.30.0"
    image: "hakai-erddap:v2.30.0-patched"
    restart: always
    container_name: ${CONTAINER_NAME:-erddap}
    # platform: linux/x86_64
    env_file:
      - .env
    # Bound to loopback deliberately: ERDDAP is reached by the Cloudflare
    # Turnstile proxy over the `proxynet` docker network, so publishing on
    # 0.0.0.0 would expose an unauthenticated path that bypasses Turnstile.
    ports:
      - "127.0.0.1:${HOST_PORT:-8090}:8080"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 12G
      replicas: 1
    volumes:
      - "./erddap/EDDTableFromDatabase.java:/usr/local/tomcat/webapps/erddap/WEB-INF/classes/gov/noaa/pfel/erddap/datasetEDDTableFromDatabase.java"
      - "./erddap/conf/robots.txt:/usr/local/tomcat/webapps/ROOT/robots.txt"
      - "./erddap/content:/usr/local/tomcat/content/erddap"
      - "./erddap/data:/erddapData"
      - "${DATASETS_DIR:-./datasets}:/datasets"
      # Bind the single script rather than the whole directory: mounting
      # ./init.d over /init.d shadows the image's own 00-advise-upstream.sh and
      # 50-datasets.d.sh, which is what regenerates datasets.xml from
      # datasets.d/ on every boot. Shadowing it loses that self-healing step.
      # Glob order still runs this last (digits sort before letters).
      # Read-only: /init.d is executed as root by the upstream entrypoint
      # before it drops privileges via setpriv.
      - "./init.d/05-fix-webapp-overlay-perms.sh:/init.d/05-fix-webapp-overlay-perms.sh:ro"
      - "./init.d/replace-datasets-secrets.sh:/init.d/replace-datasets-secrets.sh:ro"
      - "/mnt/s3/algex:/algae_explorer"
      - "./datasets.d:/datasets.d"
      - "./logs:/usr/local/tomcat/logs"
      - "./erddap/server.xml:/usr/local/tomcat/conf/server.xml"      
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8080/erddap/index.html || exit 1"
        ]
      interval: 10s
    networks:
      - proxynet

networks:
  proxynet:
    external: true
    name: turnstile_proxy_network


